# Environment for generating parity reference data from the original
# comic-translate (Python) code. The original repository is only read, never
# modified. See tools/reference/README.md.

[project]
name = "cts-reference"
version = "0.1.0"
description = "Runs functions of ogkalu2/comic-translate to produce reference outputs for parity tests."
requires-python = ">=3.12,<3.13"
dependencies = [
    # Same versions as the original requirements.txt where it matters.
    "numpy>=2.2.6",
    "pillow>=11.3.0",
    "mahotas>=1.4.18",
    "shapely>=2.1.1",
    "pyclipper>=1.3.0.post6",
    "pyside6-essentials>=6.8.0",
    "requests>=2.31.0",
    # Same ONNX Runtime release as packages/ct_onnx, so inference matches.
    "onnxruntime==1.24.4",
    # Same OpenCV release as dartcv4 builds (4.12.0): reference pages are
    # decoded with it so both sides start from identical pixels.
    "opencv-python-headless==4.12.0.88",
]

[tool.uv]
package = false
