name: comic_translate
description: "Comic Translate Screen - translate comics locally."
publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  args: ^2.7.0
  crypto: ^3.0.7
  ct_core: any
  ct_ocr_windows: any
  ct_onnx: any
  ct_providers: any
  flutter_secure_storage: ^11.2.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Default lettering font (SIL OFL 1.1, Latin and Cyrillic); CJK text falls
  # back to system fonts.
  fonts:
    - family: Pangolin
      fonts:
        - asset: assets/fonts/Pangolin-Regular.ttf
