name: comic_translate
description: "Comic Translate Screen - translate comics locally."
publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  args: ^2.7.0
  crypto: ^3.0.7
  ct_core: any
  ct_ocr_windows: any
  ct_onnx: any
  ct_providers: any
  flutter_secure_storage: ^11.2.0
  path: ^1.9.1
  flutter_riverpod: ^3.4.3
  file_selector: ^1.1.0
  desktop_drop: ^0.8.4
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  pdfrx_engine: ^0.6.1
  pdfium_dart: ^0.3.1
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  # Default lettering font (SIL OFL 1.1, Latin and Cyrillic); CJK text falls
  # back to system fonts.
  fonts:
    - family: Pangolin
      fonts:
        - asset: assets/fonts/Pangolin-Regular.ttf

  # The font's licence goes with it (also next to exported PSD files).
  assets:
    - assets/fonts/Pangolin-OFL.txt
    - assets/samples/speed_test_page.jpg
