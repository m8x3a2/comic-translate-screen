name: comic_translate_screen_workspace
description: Pub workspace root for Comic Translate Screen.
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - apps/comic_translate
  - packages/ct_core
  - packages/ct_ocr_windows
  - packages/ct_onnx
  - packages/ct_providers

hooks:
  user_defines:
    dartcv4:
      # Only what the pipeline uses: smaller DLL, faster native build.
      include_modules:
        - imgcodecs
        - imgproc
        - photo
      windows:
        use_opencl: false
