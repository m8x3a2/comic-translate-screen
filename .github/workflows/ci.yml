name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Configure Flutter
        run: |
          flutter --disable-analytics
          dart --disable-analytics
          flutter config --no-enable-record-use

      # Native build-hook outputs (OpenCV wrapper, ONNX Runtime download) take
      # several minutes to rebuild; keep them between runs.
      - uses: actions/cache@v6
        with:
          path: .dart_tool/hooks_runner
          # v2: caches from before `--no-enable-record-use` carry a dartcv4
          # keep-list that strips OpenCV functions used by newer code.
          key: hooks-v2-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'pubspec.yaml') }}
          restore-keys: hooks-v2-${{ runner.os }}-

      - name: Drop stale native keep-lists
        shell: bash
        run: rm -f .dart_tool/hooks_runner/shared/dartcv4/dartcv_keep.txt

      - name: Resolve dependencies
        run: flutter pub get

      - name: ct_core — analyze and test
        working-directory: packages/ct_core
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci_logs"
          dart analyze --fatal-infos 2>&1 | tee -a "$GITHUB_WORKSPACE/ci_logs/ct_core.log"
          dart test --reporter github 2>&1 | tee -a "$GITHUB_WORKSPACE/ci_logs/ct_core.log"

      - name: ct_onnx — analyze and test
        working-directory: packages/ct_onnx
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci_logs"
          dart analyze --fatal-infos 2>&1 | tee -a "$GITHUB_WORKSPACE/ci_logs/ct_onnx.log"
          dart test --reporter github 2>&1 | tee -a "$GITHUB_WORKSPACE/ci_logs/ct_onnx.log"

      - name: ct_ocr_windows — analyze and test
        working-directory: packages/ct_ocr_windows
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci_logs"
          dart analyze --fatal-infos 2>&1 | tee -a "$GITHUB_WORKSPACE/ci_logs/ct_ocr_windows.log"
          dart test --reporter github 2>&1 | tee -a "$GITHUB_WORKSPACE/ci_logs/ct_ocr_windows.log"

      # Parity tests that need downloaded models skip themselves here.
      - name: ct_providers — analyze and test
        working-directory: packages/ct_providers
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci_logs"
          dart analyze --fatal-infos 2>&1 | tee -a "$GITHUB_WORKSPACE/ci_logs/ct_providers.log"
          dart test --reporter github 2>&1 | tee -a "$GITHUB_WORKSPACE/ci_logs/ct_providers.log"

      - name: App — analyze and test
        working-directory: apps/comic_translate
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci_logs"
          flutter analyze 2>&1 | tee -a "$GITHUB_WORKSPACE/ci_logs/app.log"
          flutter test --timeout 120s --reporter github 2>&1 | tee -a "$GITHUB_WORKSPACE/ci_logs/app.log"

      - name: Build Windows (GUI + cts.exe)
        working-directory: apps/comic_translate
        shell: bash
        run: flutter build windows --release --dart-define=CTS_GIT_SHA=$(git rev-parse --short HEAD)

      - name: CLI smoke test
        working-directory: apps/comic_translate/build/windows/x64/runner/Release
        shell: bash
        env:
          CTS_DATA_DIR: ${{ runner.temp }}/cts-data
        run: |
          ./cts.exe version
          ./cts.exe doctor
          ./cts.exe models list
          ./cts.exe selftest render -o "$RUNNER_TEMP/render.png"
          ./cts.exe compare "$RUNNER_TEMP/render.png" "$RUNNER_TEMP/render.png"
          ./cts.exe --json report -o "$RUNNER_TEMP/report.zip"

      # The program as one zip for other computers (Actions → this run →
      # Artifacts).
      - name: Package the program
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/package_windows.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: ComicTranslateScreen-windows-x64
          path: dist/*.zip
          retention-days: 30

      # Logs need a GitHub login; annotations do not. On failure, publish the
      # tail of each step log as one annotation so failures are readable.
      - name: Publish failure details
        if: failure()
        shell: bash
        run: |
          for f in ci_logs/*.log; do
            [ -f "$f" ] || continue
            # Long lines (environment dumps of native builds) are cut so the
            # tail keeps many lines; error lines get their own annotation.
            errors=$(tr -d '\r' < "$f" | cut -c1-400 | { grep -iE 'error|exception|failed|fatal' || true; } | { grep -v '✅' || true; } | tail -n 40 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            if [ -n "$errors" ]; then echo "::error title=$(basename "$f") (error lines)::$errors"; fi
            body=$(tr -d '\r' < "$f" | cut -c1-300 | tail -c 8000 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=$(basename "$f")::$body"
          done
