name: ct_ocr_windows
description: >-
  Windows' built-in OCR (Windows.Media.Ocr) for Comic Translate Screen,
  through a small C++/WinRT library compiled by a build hook.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  code_assets: ^2.1.0
  ffi: ^2.1.4
  hooks: ^2.2.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.5

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.3
